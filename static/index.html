<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess workshop</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="layout">
      <section class="frame" aria-label="Chess board"><div id="board"></div></section>
      <dialog id="promotion" aria-label="Choose a piece to promote to">
        <form method="dialog"><p>Promote to</p><div id="promotion-choices"></div></form>
      </dialog>
      <aside>
        <h2 id="turn">White to move</h2>
        <p id="message" role="status" aria-live="polite"></p>
        <div id="controls">
          <button data-action="new" data-opponent="human">New game: two players</button>
          <button data-action="new" data-opponent="computer">New game: play the computer</button>
          <button id="undo" data-action="undo" aria-keyshortcuts="Control+Z" title="Ctrl+Z" disabled>Undo last move</button>
          <button id="redo" data-action="redo" aria-keyshortcuts="Control+Y Control+Shift+Z" title="Ctrl+Y" disabled>Redo</button>
          <button id="save">Save game</button>
          <button id="load">Load game</button>
          <input id="load-file" type="file" accept=".json,application/json" hidden>
        </div>
        <section id="captured-panel" hidden><h3>Captured pieces</h3><p id="captured"></p></section>
        <h3>Moves</h3><ol id="moves"></ol>
      </aside>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
